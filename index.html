<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đề thi lần 2 – Địa lí</title>
<style>
  :root{
    --blue:#4aa8e0; --blue-d:#2b86c0; --blue-dd:#1d5f8a; --blue-l:#e6f4fc; --blue-ll:#f4fafe;
    --line:#cfe6f5; --text:#1f3442; --muted:#5f7887;
    --ok:#2e9d5b; --ok-l:#e5f6ec; --bad:#d6493e; --bad-l:#fdecea;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--blue-ll);color:var(--text);line-height:1.5}
  .wrap{max-width:860px;margin:0 auto;padding:16px}
  .hidden{display:none!important}
  h1{color:var(--blue-dd);margin:.2em 0}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 2px 8px rgba(43,134,192,.06)}
  .hero{background:linear-gradient(135deg,#bfe3f7,#e6f4fc);border:none;text-align:center}
  .hero p{color:var(--muted);margin:.3em 0}
  label.f{display:block;font-weight:600;margin:12px 0 4px}
  input[type=text]{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;outline:none}
  input[type=text]:focus{border-color:var(--blue)}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
  .mode{border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:#fff;text-align:left;font:inherit;color:inherit}
  .mode b{display:block;font-size:17px;color:var(--blue-dd)}
  .mode span{color:var(--muted);font-size:14px}
  .mode.sel{border-color:var(--blue);background:var(--blue-l)}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:12px 22px;font-size:16px;font-weight:600;cursor:pointer}
  .btn:hover{background:var(--blue-d)}
  .btn.sec{background:#fff;color:var(--blue-d);border:1.5px solid var(--blue)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .err{color:var(--bad);font-size:14px;margin-top:6px;min-height:1em}
  .bar{position:sticky;top:0;z-index:10;background:var(--blue);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
  .bar .wrap{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
  .bar .who{font-weight:600;flex:1;min-width:150px}
  .pill{background:rgba(255,255,255,.22);border-radius:999px;padding:4px 12px;font-size:14px}
  .timer{font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;background:#fff;color:var(--blue-dd);border-radius:10px;padding:3px 12px}
  .timer.low{color:var(--bad);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.55}}
  .sec-title{background:var(--blue-l);color:var(--blue-dd);font-weight:700;border-radius:10px;padding:10px 14px;margin:26px 0 6px;border-left:5px solid var(--blue)}
  .sec-title small{display:block;font-weight:400;color:var(--muted)}
  .q{scroll-margin-top:70px}
  .qn{font-weight:700;color:var(--blue-d)}
  .opts{display:grid;gap:8px;margin-top:10px}
  .opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;background:#fff;text-align:left;font:inherit;color:inherit;width:100%}
  .opt:hover{border-color:var(--blue)}
  .opt .L{flex:0 0 28px;height:28px;border-radius:50%;background:var(--blue-l);color:var(--blue-dd);display:flex;align-items:center;justify-content:center;font-weight:700}
  .opt.sel{border-color:var(--blue);background:var(--blue-l)}
  .opt.sel .L{background:var(--blue);color:#fff}
  .opt.right{border-color:var(--ok);background:var(--ok-l)} .opt.right .L{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-l)} .opt.wrong .L{background:var(--bad);color:#fff}
  .locked .opt,.locked .tfb{cursor:default}
  table.d{border-collapse:collapse;width:100%;margin:8px 0;font-size:14px;display:block;overflow-x:auto}
  table.d td{border:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap}
  table.d tr:first-child td{background:var(--blue-l);font-weight:600}
  table.d td:first-child{text-align:left}
  .tt{text-align:center;font-weight:700;font-size:14px;margin-top:8px}
  .tu,.ts{text-align:center;font-size:13px;color:var(--muted);font-style:italic}
  .tu{text-align:right}
  .tf{display:flex;align-items:center;gap:10px;border-bottom:1px dashed var(--line);padding:9px 0}
  .tf:last-child{border-bottom:none}
  .tf .st{flex:1}
  .tfb{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;font-weight:600;cursor:pointer;font:inherit;color:inherit}
  .tfb.sel{background:var(--blue);border-color:var(--blue);color:#fff}
  .tfb.right{background:var(--ok);border-color:var(--ok);color:#fff}
  .tfb.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
  .sa{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .sa input{max-width:200px}
  .fb{margin-top:8px;font-size:14px;font-weight:600}
  .fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
  .nav{display:flex;flex-wrap:wrap;gap:5px}
  .nav a{width:34px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:7px;background:var(--blue-l);color:var(--blue-dd);font-size:13px;text-decoration:none;border:1px solid var(--line)}
  .nav a.done{background:var(--blue);color:#fff;border-color:var(--blue)}
  .nav a.r{background:var(--ok);color:#fff;border-color:var(--ok)} .nav a.w{background:var(--bad);color:#fff;border-color:var(--bad)}
  .navlbl{font-size:13px;color:var(--muted);margin:8px 0 4px}
  .score{font-size:56px;font-weight:800;color:var(--blue-dd);line-height:1}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .stat{background:var(--blue-l);border-radius:10px;padding:10px}
  .stat b{display:block;font-size:20px;color:var(--blue-dd)}
  .stat span{font-size:13px;color:var(--muted)}
  .center{text-align:center}
  .note{font-size:13px;color:var(--muted)}
  @media(max-width:560px){.modes,.grid3{grid-template-columns:1fr}.score{font-size:44px}}
</style>
</head>
<body>

<!-- START SCREEN -->
<div id="start" class="wrap">
  <div class="card hero">
    <h1 id="ttl">ĐỀ THI LẦN 2</h1>
    <p>Môn Địa lí · Phần I: 39 câu trắc nghiệm · Phần II: 4 câu Đúng/Sai · Phần III: 9 câu trả lời ngắn</p>
  </div>
  <div class="card">
    <div id="resumeBox" class="hidden" style="background:var(--blue-l);border-radius:10px;padding:12px;margin-bottom:10px">
      <div id="resumeTxt"></div>
      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="resumeBtn">Tiếp tục bài đang làm</button>
        <button class="btn sec" id="discardBtn">Làm bài mới</button>
      </div>
    </div>
    <label class="f" for="name">Họ và tên <span style="color:var(--bad)">*</span></label>
    <input type="text" id="name" placeholder="Nhập họ và tên đầy đủ" autocomplete="name">
    <label class="f" for="cls">Lớp</label>
    <input type="text" id="cls" placeholder="Ví dụ: 12A1">
    <label class="f">Chọn chế độ</label>
    <div class="modes">
      <button type="button" class="mode sel" data-mode="practice"><b>Luyện tập</b><span>Không giới hạn thời gian. Biết đúng/sai ngay sau mỗi câu.</span></button>
      <button type="button" class="mode" data-mode="test"><b>Kiểm tra · 45 phút</b><span>Có đồng hồ đếm ngược, tự động nộp bài khi hết giờ.</span></button>
    </div>
    <div class="err" id="startErr"></div>
    <div style="margin-top:12px"><button class="btn" id="startBtn">Bắt đầu làm bài</button></div>
  </div>
</div>

<!-- QUIZ -->
<div id="quiz" class="hidden">
  <div class="bar"><div class="wrap">
    <div class="who" id="who"></div>
    <span class="pill" id="modePill"></span>
    <span class="pill" id="prog"></span>
    <span class="timer hidden" id="timer">45:00</span>
  </div></div>
  <div class="wrap">
    <div class="card" id="navCard"></div>
    <div id="qs"></div>
    <div class="card center">
      <p class="note">Hãy kiểm tra lại bài trước khi nộp. Sau khi nộp sẽ không sửa được.</p>
      <button class="btn" id="submitBtn">Nộp bài</button>
    </div>
  </div>
</div>

<!-- RESULT -->
<div id="result" class="wrap hidden">
  <div class="card center">
    <div class="note" id="resWho"></div>
    <div class="score" id="resScore"></div>
    <div class="note">điểm / 10</div>
    <div class="grid3">
      <div class="stat"><b id="rMC"></b><span>Phần I – Trắc nghiệm</span></div>
      <div class="stat"><b id="rTF"></b><span>Phần II – Đúng/Sai</span></div>
      <div class="stat"><b id="rSA"></b><span>Phần III – Trả lời ngắn</span></div>
    </div>
    <p class="note" id="saveMsg"></p>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="btn" id="reviewBtn">Xem đáp án chi tiết</button>
      <button class="btn sec" id="againBtn">Làm lại từ đầu</button>
    </div>
  </div>
</div>

<script src="questions.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const LET = ["A","B","C","D"];
const KEY = "geo_lan2_session";
let S = null;        // session state
let tick = null;
let mode = "practice";

document.title = TEST_TITLE + " – Địa lí";
$("#ttl").textContent = TEST_TITLE;

// ---------- helpers ----------
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const save = () => localStorage.setItem(KEY, JSON.stringify(S));
const parseNum = v => {
  if (v == null) return NaN;
  let s = String(v).trim().replace(/%|°C|°|\s/g, "");
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, ""); // 1.234,5
  s = s.replace(",", ".");
  return /^-?\d*\.?\d+$/.test(s) ? parseFloat(s) : NaN;
};
const saRight = (i, v) => { const n = parseNum(v); return !isNaN(n) && Math.abs(n - SA[i].a) < 1e-9; };
const fmt = n => String(n).replace(".", ",");
const tableHTML = t => {
  if (!t) return "";
  let h = `<div class="tt">${esc(t.title)}</div>${t.unit ? `<div class="tu">${esc(t.unit)}</div>` : ""}<table class="d">`;
  t.rows.forEach(r => h += "<tr>" + r.map(c => `<td>${esc(c)}</td>`).join("") + "</tr>");
  h += "</table>";
  if (t.source) h += `<div class="ts">${esc(t.source)}</div>`;
  return h;
};

// ---------- start screen ----------
document.querySelectorAll(".mode").forEach(b => b.onclick = () => {
  document.querySelectorAll(".mode").forEach(x => x.classList.remove("sel"));
  b.classList.add("sel"); mode = b.dataset.mode;
});

const old = JSON.parse(localStorage.getItem(KEY) || "null");
if (old && !old.done) {
  const left = old.mode === "test" ? Math.max(0, old.end - Date.now()) : null;
  $("#resumeBox").classList.remove("hidden");
  $("#resumeTxt").innerHTML = `Có bài đang làm dở của <b>${esc(old.name)}</b> (${old.mode === "test" ? "Kiểm tra" : "Luyện tập"}).` +
    (left !== null ? (left > 0 ? ` Còn khoảng ${Math.ceil(left / 60000)} phút.` : " Đã hết giờ – bài sẽ được nộp.") : "");
  $("#resumeBtn").onclick = () => { S = old; begin(); };
  $("#discardBtn").onclick = () => { localStorage.removeItem(KEY); $("#resumeBox").classList.add("hidden"); };
}

$("#startBtn").onclick = () => {
  const name = $("#name").value.trim().replace(/\s+/g, " ");
  if (name.length < 2) { $("#startErr").textContent = "Vui lòng nhập họ và tên trước khi làm bài."; $("#name").focus(); return; }
  if (mode === "test" && !confirm("Bắt đầu bài kiểm tra 45 phút? Đồng hồ sẽ chạy ngay và bài sẽ tự nộp khi hết giờ.")) return;
  const now = Date.now();
  S = { name, cls: $("#cls").value.trim(), mode, start: now, end: mode === "test" ? now + TEST_MINUTES * 60000 : null,
        mc: Array(MC.length).fill(null), tf: TF.map(() => [null, null, null, null]), sa: Array(SA.length).fill(""),
        saChecked: Array(SA.length).fill(false), done: false };
  save(); begin();
};

// ---------- quiz ----------
function begin() {
  $("#start").classList.add("hidden"); $("#quiz").classList.remove("hidden");
  $("#who").textContent = S.name + (S.cls ? " · " + S.cls : "");
  $("#modePill").textContent = S.mode === "test" ? "Kiểm tra" : "Luyện tập";
  render(); updateNav();
  if (S.mode === "test") {
    $("#timer").classList.remove("hidden");
    const step = () => {
      const left = S.end - Date.now();
      if (left <= 0) { clearInterval(tick); $("#timer").textContent = "00:00"; finish(true); return; }
      const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
      $("#timer").textContent = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      $("#timer").classList.toggle("low", left < 5 * 60000);
    };
    step(); tick = setInterval(step, 1000);
    window.onbeforeunload = e => { if (!S.done) { e.preventDefault(); e.returnValue = ""; } };
  }
  window.scrollTo(0, 0);
}

const practice = () => S.mode === "practice";
const reviewing = () => S.done;

function render() {
  const showMC = i => reviewing() || (practice() && S.mc[i] !== null);
  const showTF = (i, j) => reviewing() || (practice() && S.tf[i][j] !== null);
  const showSA = i => reviewing() || (practice() && S.saChecked[i]);
  let h = `<div class="sec-title">PHẦN I. CÂU TRẮC NGHIỆM NHIỀU PHƯƠNG ÁN LỰA CHỌN<small>Mỗi câu chỉ chọn một phương án.</small></div>`;
  MC.forEach((q, i) => {
    const show = showMC(i);
    h += `<div class="card q ${show ? "locked" : ""}" id="mc${i}"><span class="qn">Câu ${i + 1}.</span> ${esc(q.q)}<div class="opts">`;
    q.o.forEach((o, k) => {
      const L = LET[k]; let c = S.mc[i] === L ? "sel" : "";
      if (show) c = L === q.a ? "right" : (S.mc[i] === L ? "wrong" : "");
      h += `<button type="button" class="opt ${c}" data-mc="${i}" data-l="${L}"><span class="L">${L}</span><span>${esc(o)}</span></button>`;
    });
    h += `</div>`;
    if (reviewing() && S.mc[i] === null) h += `<div class="fb no">Chưa trả lời · Đáp án: ${q.a}</div>`;
    h += `</div>`;
  });
  h += `<div class="sec-title">PHẦN II. CÂU TRẮC NGHIỆM ĐÚNG SAI<small>Ở mỗi ý a), b), c), d) chọn Đúng hoặc Sai.</small></div>`;
  TF.forEach((q, i) => {
    h += `<div class="card q" id="tf${i}"><span class="qn">Câu ${i + 1}.</span> ${esc(q.stem)}${tableHTML(q.table)}`;
    q.s.forEach((st, j) => {
      const show = showTF(i, j), v = S.tf[i][j];
      const cls = val => show ? (val === st[1] ? "right" : (v === val ? "wrong" : "")) : (v === val ? "sel" : "");
      h += `<div class="tf ${show ? "locked" : ""}"><span class="st"><b>${"abcd"[j]})</b> ${esc(st[0])}</span>
        <button type="button" class="tfb ${cls("Đ")}" data-tf="${i}" data-j="${j}" data-v="Đ">Đúng</button>
        <button type="button" class="tfb ${cls("S")}" data-tf="${i}" data-j="${j}" data-v="S">Sai</button></div>`;
    });
    h += `</div>`;
  });
  h += `<div class="sec-title">PHẦN III. CÂU TRẮC NGHIỆM TRẢ LỜI NGẮN<small>Chỉ ghi con số (dùng dấu phẩy hoặc dấu chấm cho phần thập phân), không cần ghi đơn vị.</small></div>`;
  SA.forEach((q, i) => {
    const show = showSA(i), ok = saRight(i, S.sa[i]);
    h += `<div class="card q" id="sa${i}"><span class="qn">Câu ${i + 1}.</span> ${q.table ? "Cho bảng số liệu:" : ""}${tableHTML(q.table)}<div>${esc(q.q)}</div>
      <div class="sa"><input type="text" inputmode="decimal" data-sa="${i}" value="${esc(S.sa[i])}" placeholder="Đáp số" ${show ? "disabled" : ""}>
      ${q.unit ? `<span>${q.unit}</span>` : ""}
      ${practice() && !show ? `<button type="button" class="btn sec" data-chk="${i}" style="padding:8px 14px">Kiểm tra</button>` : ""}</div>
      ${show ? `<div class="fb ${ok ? "ok" : "no"}">${ok ? "✓ Chính xác" : "✗ Chưa đúng"} · Đáp án: ${fmt(q.a)}${q.unit ? " " + q.unit : ""}</div>` : ""}</div>`;
  });
  $("#qs").innerHTML = h;
}

$("#qs").addEventListener("click", e => {
  if (S.done) return;
  const o = e.target.closest(".opt");
  if (o) {
    const i = +o.dataset.mc;
    if (practice() && S.mc[i] !== null) return;
    S.mc[i] = o.dataset.l; save(); rerender(); return;
  }
  const t = e.target.closest(".tfb");
  if (t) {
    const i = +t.dataset.tf, j = +t.dataset.j;
    if (practice() && S.tf[i][j] !== null) return;
    S.tf[i][j] = t.dataset.v; save(); rerender(); return;
  }
  const c = e.target.closest("[data-chk]");
  if (c) {
    const i = +c.dataset.chk;
    if (!String(S.sa[i]).trim()) { alert("Hãy nhập đáp số trước khi kiểm tra."); return; }
    if (isNaN(parseNum(S.sa[i]))) { alert("Đáp số phải là một con số."); return; }
    S.saChecked[i] = true; save(); rerender();
  }
});
$("#qs").addEventListener("input", e => {
  const inp = e.target.closest("[data-sa]");
  if (inp) { S.sa[+inp.dataset.sa] = inp.value; save(); updateNav(); }
});
function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); updateNav(); }

function updateNav() {
  const cell = (id, n, answered, state) => `<a href="#${id}" class="${state || (answered ? "done" : "")}">${n}</a>`;
  const showAll = reviewing();
  let mcH = "", tfH = "", saH = "", ans = 0, tot = MC.length + TF.length * 4 + SA.length;
  MC.forEach((q, i) => {
    const a = S.mc[i] !== null; ans += a;
    const st = (showAll || (practice() && a)) ? (S.mc[i] === q.a ? "r" : "w") : "";
    mcH += cell("mc" + i, i + 1, a, st);
  });
  TF.forEach((q, i) => {
    const n = S.tf[i].filter(v => v !== null).length; ans += n;
    const all = n === 4, st = (showAll || (practice() && all)) ? (q.s.every((s, j) => S.tf[i][j] === s[1]) ? "r" : "w") : "";
    tfH += cell("tf" + i, i + 1, all, st);
  });
  SA.forEach((q, i) => {
    const a = String(S.sa[i]).trim() !== ""; ans += a;
    const st = (showAll || (practice() && S.saChecked[i])) ? (saRight(i, S.sa[i]) ? "r" : "w") : "";
    saH += cell("sa" + i, i + 1, a, st);
  });
  $("#navCard").innerHTML = `<div class="navlbl">Phần I</div><div class="nav">${mcH}</div>
    <div class="navlbl">Phần II</div><div class="nav">${tfH}</div><div class="navlbl">Phần III</div><div class="nav">${saH}</div>`;
  $("#prog").textContent = `Đã làm ${ans}/${tot}`;
}

// ---------- scoring ----------
function score() {
  const mcRight = MC.filter((q, i) => S.mc[i] === q.a).length;
  const TFP = [0, 0.1, 0.25, 0.5, 1];
  let tfPts = 0, tfStmts = 0;
  TF.forEach((q, i) => { const n = q.s.filter((s, j) => S.tf[i][j] === s[1]).length; tfStmts += n; tfPts += TFP[n]; });
  const saRightN = SA.filter((q, i) => saRight(i, S.sa[i])).length;
  const raw = mcRight * 0.25 + tfPts + saRightN * 0.25;
  const max = MC.length * 0.25 + TF.length + SA.length * 0.25;
  return { mcRight, tfPts: Math.round(tfPts * 100) / 100, tfStmts, saRight: saRightN,
           score: Math.round(raw / max * 10 * 100) / 100 };
}

$("#submitBtn").onclick = () => {
  const un = S.mc.filter(v => v === null).length + S.tf.flat().filter(v => v === null).length + S.sa.filter(v => !String(v).trim()).length;
  if (!confirm(un ? `Bạn còn ${un} ý chưa trả lời. Vẫn nộp bài?` : "Bạn chắc chắn muốn nộp bài?")) return;
  finish(false);
};

function finish(auto) {
  if (S.done) return;
  clearInterval(tick); window.onbeforeunload = null;
  S.done = true; S.finished = Date.now(); S.result = score(); save();
  if (auto) alert("Đã hết giờ! Bài làm của bạn được nộp tự động.");
  showResult(); send();
}

function showResult() {
  const r = S.result;
  $("#quiz").classList.add("hidden"); $("#result").classList.remove("hidden");
  $("#resWho").textContent = `${S.name}${S.cls ? " · " + S.cls : ""} · ${S.mode === "test" ? "Kiểm tra" : "Luyện tập"}`;
  $("#resScore").textContent = fmt(r.score);
  $("#rMC").textContent = `${r.mcRight}/${MC.length} câu`;
  $("#rTF").textContent = `${fmt(r.tfPts)}/${TF.length} điểm`;
  $("#rSA").textContent = `${r.saRight}/${SA.length} câu`;
  window.scrollTo(0, 0);
}

function send() {
  const r = S.result, secs = Math.round((S.finished - S.start) / 1000);
  const payload = {
    name: S.name, cls: S.cls, mode: S.mode === "test" ? "Kiểm tra" : "Luyện tập",
    score: r.score, mc: `${r.mcRight}/${MC.length}`, tf: `${r.tfPts}/${TF.length} (${r.tfStmts}/16 ý)`, sa: `${r.saRight}/${SA.length}`,
    time: `${Math.floor(secs / 60)} phút ${secs % 60} giây`,
    started: new Date(S.start).toLocaleString("vi-VN"),
    answers: "I: " + S.mc.map((v, i) => `${i + 1}${v || "-"}`).join(" ") +
             " | II: " + S.tf.map((a, i) => `${i + 1}:` + a.map(v => v || "-").join("")).join(" ") +
             " | III: " + S.sa.map((v, i) => `${i + 1}=${String(v).trim() || "-"}`).join("; ")
  };
  if (!SCRIPT_URL || SCRIPT_URL.startsWith("PASTE")) { $("#saveMsg").textContent = "(Chưa kết nối Google Sheet – kết quả chưa được lưu.)"; return; }
  $("#saveMsg").textContent = "Đang lưu kết quả...";
  const attempt = n => fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
    .then(() => { $("#saveMsg").textContent = "✓ Kết quả đã được gửi cho giáo viên."; S.sent = true; save(); })
    .catch(() => n > 0 ? setTimeout(() => attempt(n - 1), 3000)
      : ($("#saveMsg").innerHTML = `Không gửi được kết quả (lỗi mạng). <a href="#" id="retry">Thử lại</a>`,
         $("#retry").onclick = ev => { ev.preventDefault(); attempt(2); }));
  attempt(2);
}

$("#reviewBtn").onclick = () => {
  $("#result").classList.add("hidden"); $("#quiz").classList.remove("hidden");
  $("#timer").classList.add("hidden"); $("#submitBtn").textContent = "Quay lại kết quả";
  $("#submitBtn").onclick = () => { $("#quiz").classList.add("hidden"); $("#result").classList.remove("hidden"); window.scrollTo(0, 0); };
  render(); updateNav(); window.scrollTo(0, 0);
};
$("#againBtn").onclick = () => { localStorage.removeItem(KEY); location.reload(); };

// a finished-but-reloaded session goes straight to its result
if (old && old.done) { S = old; $("#start").classList.add("hidden"); showResult(); if (!S.sent) send(); }
})();
</script>
</body>
</html>
